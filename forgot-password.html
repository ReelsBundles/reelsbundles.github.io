<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | ReelsBundles</title>

    <link rel="stylesheet" href="assets/css/auth.css">
    <script src="assets/js/content-protection.js"></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <a href="index.html">
                ReelsBundles
            </a>
        </div>

        <div class="auth-header">

            <h1>Reset Password</h1>

            <p>
                Enter your email and we'll send you
                a password reset link.
            </p>

        </div>

        <form id="forgotPasswordForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div
                id="authMessage"
                class="auth-message"
            ></div>

            <button
                type="submit"
                id="resetBtn"
                class="primary-btn"
            >
                Send Reset Link
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Remember your password?
                <a href="login.html">
                    Sign In
                </a>
            </p>

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to ReelsBundles
            </a>

        </div>

    </div>

</div>

<script
    type="module"
    src="assets/js/forgot-password.js"
></script>

    
</body>
</html>
